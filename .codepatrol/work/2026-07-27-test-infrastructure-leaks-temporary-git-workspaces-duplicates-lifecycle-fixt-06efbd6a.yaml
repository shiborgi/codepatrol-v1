  ## Evidence

  - src/change/change.test.ts has 17 mkdtempSync calls and no workspace-root cleanup
  - src/change/git.test.ts has 19 mkdtempSync calls and no workspace-root cleanup
  - src/change/git.test-helper.ts duplicates advanceThroughVerify and matches neither **/*.test.ts nor tsconfig.build.json exclusion **/*.helper.ts
  - tsconfig.build.json:10 therefore includes git.test-helper.ts in dist
  - large mixed-responsibility suites include src/cli/cli.test.ts, src/change/change.test.ts and src/change/git.test.ts
