  - id: 2b7becb0-56eb-40a2-be29-cbddd9984a61
    at: 2026-07-25T16:47:02.410Z
    actor: claude-opus-5
    stage: apply
    attempt: 1
    type: stage-returned
    to_stage: plan
    reason: "Contract defect (blocking, found before any mutation): the accepted plan.md cannot be consumed by the shipped Apply-session derivation, so Apply cannot even prime its Stage Session. `codepatrol change session --action prime` fails with `CHANGE_INVALID: Session item T3 has invalid dependency T3`. Root cause is deriveItems' dependency parser at src/change/session.ts:58, which extracts every /\\bT\\d+\\b/ token from the `**Depends on:**` line, and TWO plan.md lines trip it. (1) BLOCKING, plan.md:122 -- T3's line reads `T2 (same file, session.ts; sequenced. trace.ts and improvement-report.ts are T3-exclusive.)`; the trailing phrase `T3-exclusive` parses as a dependency, giving T3 a self-dependency, which validate() correctly rejects. (2) SILENT AND WORSE, plan.md:155 -- T4's line reads `None (docs/skills only; file-disjoint from T1-T3)`; the None-guard on the same line tests /^(none|nothing)$/i against the whole trimmed line, which is not exactly `None`, so the guard misses and T1 plus T3 are extracted as dependencies. T4 is declared file-disjoint and runnable at any point, but would derive as blocked until T1 and T3 close. That produces no error at all -- just a silently wrong todo list, which is precisely the failure class this Change exists to eliminate. Verified by reproducing both parses directly against the two literal lines. No production code was touched; the tree is clean. Apply must not edit plan/ artifacts, and the fix involves a design decision that belongs to Plan: whether to (a) only reword the two prose lines so they parse correctly, or (b) additionally harden deriveItems -- filter self-references (dep !== item.id) and anchor the None-guard to the leading token rather than the whole line -- as declared scope. Recommendation: do both, and fold (b) into T1/T2, which already own src/change/session.ts and already own this exact function; the parser fragility is in scope by construction, it is a live example of the defect class in spec.md's Problem statement, and it should carry its own AC plus a red-capable test using these two literal lines as the fixture. Also update plan.md's own prose so the plan is self-consistently parseable by the mechanism it ships."
    next_action: "codepatrol-plan 2026-07-25-session-handoff on codepatrol/2026-07-25-session-handoff: reword plan.md:122 (drop the `T3-exclusive` phrasing from T3's Depends-on line) and plan.md:155 (make T4's Depends-on line exactly `None`, moving the parenthetical elsewhere); then decide and declare whether deriveItems' dependency parser is hardened in scope (self-dependency filter + leading-token None-guard at src/change/session.ts:58) with its own AC and red-capable test over these two literal lines."
