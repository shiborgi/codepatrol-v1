    to_stage: apply
    reason: "Regression (critical, newly introduced by this attempt's Finding-1 fix): reverting parseStatusPaths' .codepatrol/backlog/ exemption (correctly, to fix Close's silent-untracked-file bug) was not paired with equivalent commit handling for the other two backlog write paths -- change start's linkBacklogItem call (orchestrator.ts:185, used by AC-5's backlogItemId flow) and the standalone `backlog add` CLI (the exact command skills/codepatrol-plan/SKILL.md:33's own T8 instruction tells Plan to run for split follow-ups). apply/journal.md's T1B section claims 'every other code path that calls parseStatusPaths is unaffected' -- this is false for these two paths. Reproduced live in two throwaway scratch repos whose .gitignore matches this project's real .gitignore (does not exempt .codepatrol/backlog/): (1) committed a candidate item, ran `change start --backlogItemId <id>`, then submitted a Plan checkpoint transition -> failed with `CHANGE_CONFLICT: Checkpoint has undeclared worktree paths: .codepatrol/backlog/items.yaml`; (2) started a fresh Change, called `codepatrol backlog add` with source.kind=plan-followup (T8's own instructed workflow), then submitted the same Plan checkpoint -> identical failure. Root cause of the test-suite blind spot: src/change/start-backlog-link.test.ts's initRepo helper gitignores .codepatrol/backlog/ in its scratch repo (unlike the real project), so none of its 4 cases nor any of the 173 passing tests exercises a Plan checkpoint after a real non-gitignored backlog write -- the exact interaction this attempt's parseStatusPaths revert reintroduced. Full transcripts and both exact error strings are in verify/report.md."
    next_action: "codepatrol-apply 2026-07-24-backlog-subsystem on codepatrol/2026-07-24-backlog-subsystem: extend the Finding-1 commit fix to (a) change start's backlogItemId linkage and (b) the standalone backlog add CLI path -- either commit .codepatrol/backlog/items.yaml in both, or explicitly document+enforce who is responsible for committing it before the next checkpoint; fix start-backlog-link.test.ts's initRepo .gitignore to match the real project (remove the .codepatrol/backlog/ exemption) so this class of regression cannot pass silently again; add a regression test that a Plan checkpoint succeeds immediately after each backlog write path; re-run npm run verify; re-checkpoint. See verify/report.md Finding 1 (critical, blocking) and Finding 2 (minor, optional, carried over)."
