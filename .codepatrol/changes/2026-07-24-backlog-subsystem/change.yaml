  - id: f0218473-ac04-444c-8b3d-768cb58521b2
    at: 2026-07-25T02:37:44.391Z
    actor: claude-sonnet-5
    stage: verify
    attempt: 1
    type: stage-returned
    to_stage: apply
    reason: "Implementation defect (major, conformance): .codepatrol/backlog/items.yaml is written by writeBacklog() via atomicWriteFile only and is never git-added/committed by any code path (backlog add CLI, the Close hook at orchestrator.ts:405-411, or change start's linkBacklogItem call at orchestrator.ts:185). This directly contradicts the T1-amended governing docs' explicit claim that the file is \"tracked\" (AGENTS.md:17-18, docs/runtime-state.md:27-31), which deliberately contrasts it with the gitignored, rebuildable .codepatrol/runtime/. Worse, orchestrator.ts:25's parseStatusPaths -- the single choke point every clean-worktree pre/postcondition uses (change start's check at :169, Close's postcondition at :439) -- was edited to add !path.startsWith(\".codepatrol/backlog/\"), so the tooling actively hides the resulting untracked/dirty state instead of committing it. Reproduced live in two scratch repos: `backlog add` leaves `?? .codepatrol/` in `git status`; a full `change start --backlogItemId` (which does commit the change record via commitMetadata) still leaves `?? .codepatrol/backlog/` afterward. Risk: an operator trusting Codepatrol's own clean-tree signals could run `git clean -fd` and permanently lose the backlog, and no clone/worktree/CI ever receives any backlog item across the life of the repo. Required correction: make at least one write path (most naturally Close's existing terminal commit at orchestrator.ts:412's pathsToCommit, mirroring how reportPath is conditionally added) actually stage and commit .codepatrol/backlog/items.yaml, instead of only teaching parseStatusPaths to ignore it. Minor secondary note (non-blocking, optional to fold in): spec.md AC-6 says `codepatrol status --format markdown`, but the CLI's global --format only accepts text|json (src/cli/args.ts:95); the AC's substance is already satisfied because status's default/text output is markdown-shaped and matches scripts/render-kanban.mjs's output, verified live -- this is pre-existing spec phrasing, not something Apply introduced, and only needs a wording fix. Full detail, re-executed AC-1..AC-8 evidence, and blast-radius audit in verify/report.md."
    next_action: "codepatrol-apply 2026-07-24-backlog-subsystem on codepatrol/2026-07-24-backlog-subsystem: commit .codepatrol/backlog/items.yaml in at least one write path (recommended: Close's terminal commit, orchestrator.ts:412) so the file is genuinely git-tracked as AGENTS.md/docs/runtime-state.md now promise; re-run npm run verify; re-checkpoint. See verify/report.md Finding 1 (major, blocking) and Finding 2 (minor, optional)."
